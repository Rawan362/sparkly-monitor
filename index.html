<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sparkly AI</title>

<!-- PWA / installable app config -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E4A87">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sparkly AI">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4ED;
    --panel: #FFFFFF;
    --panel-2: #EFEAE0;
    --border: #E1DACB;
    --text: #2A2A26;
    --text-muted: #7A7568;
    --accent: #2E4A87;
    --accent-soft: rgba(46,74,135,0.08);
    --on-accent: #FFFFFF;
    --accent-2: #2F9E6E;
    --accent-2-soft: rgba(47,158,110,0.08);
    --danger: #D2483F;
    --danger-soft: rgba(210,72,63,0.08);
    --bubble-out-bg: #FBF7EE;
    --badge-gold-bg: #fdf3da;
    --badge-gold-text: #7a6416;
    --badge-gold-border: #eddca0;
    --shadow-color: 42,42,38;
    --font-display: 'Fraunces', Georgia, serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #17140F;
    --panel: #201C15;
    --panel-2: #29241A;
    --border: #3C3527;
    --text: #EEE9DD;
    --text-muted: #A69C88;
    --accent: #7B9EEA;
    --accent-soft: rgba(123,158,234,0.14);
    --on-accent: #131A2E;
    --accent-2: #57C89A;
    --accent-2-soft: rgba(87,200,154,0.14);
    --danger: #EC7B6E;
    --danger-soft: rgba(236,123,110,0.14);
    --bubble-out-bg: #262115;
    --badge-gold-bg: #3A3018;
    --badge-gold-text: #E4C874;
    --badge-gold-border: #4F4222;
    --shadow-color: 0,0,0;
  }
  html, body { transition: background-color 0.25s ease, color 0.25s ease; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  #app { display: flex; height: 100vh; position: relative; background: var(--bg); }

  /* ═══ CHANNEL RAIL ═══ */
  #menu-toggle {
    display: none;
    border: none;
    background: none;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    padding: 4px 2px;
    line-height: 1;
  }
  #app.sidebar-hidden #menu-toggle { display: block; }

  /* ═══ SIDEBAR ═══ */
  #sidebar {
    width: 340px;
    min-width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--panel-2);
    transition: margin-left 0.2s ease;
  }
  #app.sidebar-hidden #sidebar { margin-left: -340px; }

  #sidebar-header {
    padding: calc(22px + env(safe-area-inset-top)) 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #sidebar-header h1 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 2px;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  #sidebar-header p { font-size: 12px; color: var(--text-muted); margin: 0; }
  #sidebar-close {
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
  }
  #sidebar-close:hover { background: var(--panel-2); }

  #channel-pills {
    display: flex;
    gap: 6px;
    padding: 0 14px 12px;
    overflow-x: auto;
  }
  .channel-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--panel-2);
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    border: 1px solid transparent;
  }
  .channel-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .channel-pill.active { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
  .channel-pill.disabled { cursor: not-allowed; opacity: 0.5; }
  .convo-avatar-wrap { position: relative; flex-shrink: 0; }
  .channel-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--panel);
  }
  .chat-channel-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .chat-channel-tag .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  #search-wrap { padding: 4px 16px 12px; position: relative; }
  #search-box {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 9px 14px 9px 34px;
    font-size: 13.5px;
    color: var(--text);
  }
  #search-box:focus { outline: none; background: var(--panel); border-color: var(--border); }
  #search-icon { position: absolute; left: 30px; top: 14px; color: var(--text-muted); font-size: 13px; pointer-events: none; }

  #chats-tab-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #settings-tab-content { flex: 1; overflow-y: auto; }
  #language-tab-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
  #lang-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #lang-header button { border: none; background: none; color: var(--text); cursor: pointer; display: flex; padding: 4px; flex-shrink: 0; }
  #lang-search {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13.5px;
    color: var(--text);
    outline: none;
  }
  #lang-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .lang-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
    cursor: pointer;
    font-size: 14.5px;
    color: var(--text);
  }
  .lang-row:hover { background: var(--panel-2); }
  .lang-row .lang-native { color: var(--text-muted); font-size: 12.5px; margin-left: 8px; }
  .lang-row .lang-check { color: var(--accent); display: none; }
  .lang-row.selected .lang-check { display: block; }

  .device-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 20px;
  }
  .device-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--panel-2);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .device-info { flex: 1; min-width: 0; }
  .device-label { font-size: 14px; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .device-this-tag { font-size: 10.5px; font-weight: 600; color: var(--accent-2); background: var(--accent-2-soft); padding: 2px 7px; border-radius: 10px; }
  .device-time { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .device-signout-btn {
    border: 1px solid var(--danger); background: none; color: var(--danger);
    font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 16px; cursor: pointer; flex-shrink: 0;
  }
  #convo-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  #sidebar-bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 0 10px;
    cursor: pointer;
    color: var(--text-muted);
  }
  @keyframes screen-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #main.screen-transition, #chats-tab-content.screen-transition, #settings-tab-content.screen-transition { animation: screen-fade-in 0.18s ease; }

  .bottom-nav-item span { font-size: 11px; font-weight: 500; }
  .bottom-nav-item.active { color: var(--accent); }
  .bottom-nav-item:hover { background: var(--border); }
  button, .convo-item, .bottom-nav-item, .settings-row, .channel-pill {
    transition: transform 0.08s ease, opacity 0.08s ease, background 0.15s ease;
  }
  button:active, .convo-item:active, .bottom-nav-item:active, .settings-row:active {
    transform: scale(0.97);
    opacity: 0.85;
  }
  .convo-row {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    margin-bottom: 3px;
  }
  .convo-actions-strip {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    z-index: 1;
    background: var(--panel-2);
  }
  .convo-action-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0;
    transform: scale(0.5);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, box-shadow 0.15s ease;
    box-shadow: 0 3px 8px -2px rgba(0,0,0,0.25);
  }
  .convo-row.revealed .convo-action-btn { opacity: 1; transform: scale(1); }
  .convo-row.revealed .convo-action-btn.more { transition-delay: 0.02s; }
  .convo-row.revealed .convo-action-btn.delete { transition-delay: 0.07s; }
  .convo-action-btn:active { transform: scale(0.88) !important; }
  .convo-action-btn.more { background: linear-gradient(155deg, #9AA1AE, #757C89); }
  .convo-action-btn.delete { background: linear-gradient(155deg, #F0655C, var(--danger)); }
  .convo-item { box-shadow: 0 0 0 rgba(0,0,0,0); transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.32s ease; }
  .convo-row.dragging .convo-item { box-shadow: -6px 0 16px -8px rgba(0,0,0,0.18); }
  .convo-badges { display: inline-flex; gap: 3px; color: var(--accent); margin-right: 4px; vertical-align: -1px; }

  #action-sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,18,14,0.4);
    z-index: 60;
    align-items: flex-end;
    justify-content: center;
  }
  #action-sheet-overlay.show { display: flex; }
  #action-sheet {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border-radius: 18px 18px 0 0;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    max-height: 70vh;
    overflow-y: auto;
  }
  #action-sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 3px; margin: 8px auto 6px; }
  .action-sheet-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 20px;
    cursor: pointer;
    font-size: 14.5px;
    color: var(--text);
    opacity: 0;
    transform: translateY(8px);
    animation: sheet-item-in 0.22s ease forwards;
  }
  .action-sheet-item svg { flex-shrink: 0; opacity: 0.75; }
  .action-sheet-item:hover { background: var(--panel-2); }
  .action-sheet-item.danger { color: var(--danger); }
  @keyframes sheet-item-in { to { opacity: 1; transform: translateY(0); } }
  .convo-item {
    padding: 11px 10px;
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--panel-2);
    position: relative;
    z-index: 2;
    touch-action: pan-y;
  }
  .convo-item:hover { background: var(--border); }
  .convo-item.active { background: var(--accent-soft); }
  .convo-avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 15px;
  }
  .convo-body { flex: 1; min-width: 0; }
  .convo-top { display: flex; justify-content: space-between; align-items: baseline; }
  .convo-phone { font-weight: 560; font-size: 14px; color: var(--text); }
  .convo-time { font-size: 10.5px; color: var(--text-muted); flex-shrink: 0; }
  .convo-preview-row { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .convo-preview {
    font-size: 12.5px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 210px;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.live { background: var(--accent-2); animation: breathe-live 2.6s ease-in-out infinite; }
  .status-dot.paused { background: var(--danger); }
  @keyframes breathe-live {
    0%, 100% { box-shadow: 0 0 0 0 rgba(47,158,110,0.5); }
    50% { box-shadow: 0 0 0 4px rgba(47,158,110,0); }
  }
  .unread-badge { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .convo-item.unread .convo-phone { font-weight: 650; }
  .convo-item.unread .convo-preview { color: var(--text); font-weight: 560; }

  /* ═══ MAIN CHAT AREA ═══ */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--bg); }
  #empty-state-header { padding: 4px 0 0 16px; height: 0; overflow: visible; }
  #app.sidebar-hidden #empty-state-header { height: auto; padding-top: 16px; padding-bottom: 6px; }
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13.5px;
    gap: 12px;
  }
  #empty-state .icon { font-size: 40px; opacity: 0.25; }

  #chat-header {
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    min-height: 60px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    box-sizing: border-box;
  }
  #chat-header-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  #back-arrow {
    display: none;
    border: none;
    background: none;
    font-size: 19px;
    color: var(--text);
    cursor: pointer;
    padding: 6px;
    margin-right: 2px;
    line-height: 1;
    flex-shrink: 0;
  }
  .chat-avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 16px;
    flex-shrink: 0;
  }
  #chat-header-info h2 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.005em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #ai-paused-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: var(--danger-soft);
    border-top: 1px solid var(--border);
  }
  #ai-paused-banner span { font-size: 12.5px; color: var(--danger); font-weight: 500; }
  #ai-paused-banner button {
    border: none;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 8% 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--panel-2);
  }
  #scroll-bottom-btn {
    position: absolute;
    right: 24px;
    bottom: 78px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    z-index: 5;
    transition: background 0.15s ease;
  }
  #scroll-bottom-btn:hover { background: var(--panel-2); }
  #scroll-bottom-btn.show { display: flex; }
  .msg-row { display: flex; margin: 3px 0; }
  .msg-row.out { justify-content: flex-end; }
  .bubble {
    max-width: 62%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.48;
    position: relative;
  }
  .msg-row.in .bubble { background: var(--panel); border: none; border-bottom-left-radius: 4px; color: var(--text); }
  .msg-row.out .bubble { background: var(--bubble-out-bg); color: var(--accent); font-weight: 600; border: none; border-bottom-right-radius: 4px; }
  .bubble .msg-text { white-space: pre-wrap; word-break: break-word; }
  .bubble .ts {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    margin-top: 4px;
    opacity: 0.7;
  }
  .msg-row.in .bubble .ts { color: var(--text-muted); }
  .msg-row.out .bubble .ts { color: rgba(46,74,135,0.7); }
  .ts .ticks { display: inline-flex; }
  .ts .ticks svg { display: block; }
  .ts .ticks.read { color: #4FB3F6; }
  .bubble.private-note { background: var(--badge-gold-bg); color: var(--badge-gold-text); border: 1px solid var(--badge-gold-border); }
  .typing-bubble { display: flex; align-items: center; gap: 4px; padding: 12px 16px !important; }
  .typing-bubble .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: typing-bounce 1.2s infinite ease-in-out; }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .bubble.private-note .ts { color: var(--badge-gold-text); opacity: 0.65; }
  .date-divider {
    align-self: center;
    background: var(--panel-2);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 8px;
    margin: 12px 0;
  }

  #composer {
    padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
    background: var(--bg);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    min-height: 42px;
    background: var(--panel);
    color: var(--text);
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    min-width: 40px;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #mic-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    min-width: 40px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mic-btn.recording {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse-rec 1.2s infinite;
  }

function timeAgo(ts) {
  const diff = (Date.now() - new Date(ts).getTime()) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'd';
}

function initials(phone) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  return digits.slice(-2) || '?';
}

// Slack/WhatsApp-style avatar palette — muted, pleasant tones that read
// well with white text. Same phone number always maps to the same color.
const AVATAR_PALETTE = [
  '#6b7fd7', '#e08e45', '#4fa88c', '#c76b96', '#5aa9c9',
  '#a67c52', '#7d8c5c', '#c96b6b', '#8577c9', '#4f9a6f'
];
function avatarColor(phone) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  let hash = 0;
  for (let i = 0; i < digits.length; i++) {
    hash = (hash * 31 + digits.charCodeAt(i)) % 100000;
  }
  return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
}

async function loadConversations() {
  heartbeatSession();
  const rows = await sb(
    'conversations?seller_id=eq.' + SELLER_CHAT_ID +
    '&select=phone_number,message,role,timestamp,channel&order=timestamp.desc&limit=500'
  );
  const byPhone = {};
  rows.forEach(r => {
    if (!byPhone[r.phone_number]) byPhone[r.phone_number] = r;
  });
  const statuses = await sb(
    'client_status?seller_id=eq.' + SELLER_CHAT_ID + '&select=phone_number,ai_active,pinned,muted,archived,favorite,blocked'
  );
  const statusMap = {};
  statuses.forEach(s => { statusMap[s.phone_number] = s; });

  const custs = await sb(
    'customers?seller_id=eq.' + SELLER_CHAT_ID + '&select=phone,name'
  );
  const nameMap = {};
  custs.forEach(c => { if (c.name) nameMap[c.phone] = c.name; });

  conversations = Object.values(byPhone)
    .map(c => {
      const st = statusMap[c.phone_number] || {};
      return {
        ...c,
        channel: c.channel || 'whatsapp',
        aiActive: st.ai_active !== false,
        pinned: !!st.pinned,
        muted: !!st.muted,
        archived: !!st.archived,
        favorite: !!st.favorite,
        blocked: !!st.blocked,
        displayName: nameMap[c.phone_number] || c.phone_number
      };
    })
    .sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return new Date(b.timestamp) - new Date(a.timestamp);
    });

  renderChannelPills();
  renderConvoList();
  if (activePhone) await loadThread(activePhone, true);
  if (ahmadChatOpen) await renderAhmadChatPanel(true);
}

function renderChannelPills() {
  const el = document.getElementById('channel-pills');
  if (!el) return;
  const order = ['all', 'whatsapp', 'instagram', 'messenger', 'tiktok', 'email'];
  el.innerHTML = order.map(key => {
    if (key === 'all') {
      return `<div class="channel-pill ${channelFilter === 'all' ? 'active' : ''}" onclick="setChannelFilter('all')">All</div>`;
    }
    const meta = CHANNEL_META[key];
    const isLive = LIVE_CHANNELS.includes(key);
    const cls = 'channel-pill' + (channelFilter === key ? ' active' : '') + (isLive ? '' : ' disabled');
    const title = isLive ? meta.label : meta.label + ' — coming soon';
    const onclick = isLive ? `onclick="setChannelFilter('${key}')"` : '';
    return `<div class="${cls}" title="${title}" ${onclick}><span class="dot" style="background:${meta.color}"></span>${meta.label}</div>`;
  }).join('');
}

window.setChannelFilter = function(key) {

  // The 8-second background refresh rebuilds this whole list — without this,
  // an open swipe-actions row would silently snap shut the next time it polls.
  if (swipeOpenPhone) {
    const openRow = document.querySelector('.convo-row[data-phone="' + CSS.escape(swipeOpenPhone) + '"]');
    if (openRow) {
      const openItem = openRow.querySelector('.convo-item');
      openItem.style.transition = 'none';
      openItem.style.transform = 'translateX(-' + STRIP_WIDTH + 'px)';
    } else {
      swipeOpenPhone = null; // that conversation is gone now (deleted/archived) — nothing to restore
    }
  }
}

// ═══ Swipe-to-reveal row actions (delegated, since rows re-render often) ═══
const STRIP_WIDTH = 120; // exact: 10px pad + 46px btn + 8px gap + 46px btn + 10px pad
const REVEAL_THRESHOLD = 14; // px of drag before buttons start animating in
const MAX_OVERDRAG = 34; // extra rubber-band travel past the strip
let swipeOpenPhone = null;
let swipeStartX = 0, swipeStartY = 0, swipeDragging = false, swipeDecided = false, swipeMoved = false;
let swipeStartOffset = 0;

function rubberBand(raw) {
  if (raw >= 0) return 0;
  if (raw >= -STRIP_WIDTH) return raw;
  const over = -raw - STRIP_WIDTH;
  const damped = MAX_OVERDRAG * (1 - Math.exp(-over / 60)); // eases off the further you pull
  return -(STRIP_WIDTH + damped);
}

function closeSwipeRow(phone) {
  const row = document.querySelector('.convo-row[data-phone="' + CSS.escape(phone) + '"]');
  if (!row) return;
  const item = row.querySelector('.convo-item');
  item.style.transition = '';
  item.style.transform = '';
  item.style.boxShadow = '';
  row.classList.remove('revealed', 'dragging');
  swipeOpenPhone = null;
}

(function() {
  const list = document.getElementById('convo-list');
  if (!list) return;

  list.addEventListener('touchstart', (e) => {
    const row = e.target.closest('.convo-row');
    if (!row) return;
    const item = row.querySelector('.convo-item');
    const phone = row.dataset.phone;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeDecided = false;
    swipeDragging = false;
    swipeMoved = false;
    swipeStartOffset = (swipeOpenPhone === phone) ? -STRIP_WIDTH : 0;
    item.style.transition = 'none';
  }, { passive: true });

  list.addEventListener('touchmove', (e) => {
    const row = e.target.closest('.convo-row');
    if (!row) return;
    const item = row.querySelector('.convo-item');
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;

    if (!swipeDecided) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      swipeDecided = true;
      swipeDragging = Math.abs(dx) > Math.abs(dy);
      if (!swipeDragging) return;
      if (swipeOpenPhone && swipeOpenPhone !== row.dataset.phone) closeSwipeRow(swipeOpenPhone);
      row.classList.add('dragging');
    }
    if (!swipeDragging) return;
    swipeMoved = true;
    const raw = swipeStartOffset + dx;
    const eased = rubberBand(raw);
    item.style.transform = 'translateX(' + eased + 'px)';
    row.classList.toggle('revealed', eased < -REVEAL_THRESHOLD);
  }, { passive: true });

  list.addEventListener('touchend', (e) => {
    const row = e.target.closest('.convo-row');
    if (!row) return;
    const item = row.querySelector('.convo-item');
    const phone = row.dataset.phone;
    row.classList.remove('dragging');
    item.style.transition = 'transform 0.32s cubic-bezier(0.22, 1, 0.36, 1)';

    if (!swipeDragging) return;
    const dx = (e.changedTouches[0].clientX - swipeStartX);
    const finalOffset = swipeStartOffset + dx;
    if (finalOffset < -STRIP_WIDTH / 2) {
      item.style.transform = 'translateX(-' + STRIP_WIDTH + 'px)';
      row.classList.add('revealed');
      swipeOpenPhone = phone;
    } else {
      item.style.transform = 'translateX(0)';
      row.classList.remove('revealed');
      swipeOpenPhone = null;
    }
  });
})();

function formatDateDivider(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
}

async function loadThread(phone, silent) {
  const oldBox = document.getElementById('messages');
  let oldScrollTop = 0;
  let wasNearBottom = true;
  if (oldBox) {
    oldScrollTop = oldBox.scrollTop;
    wasNearBottom = (oldBox.scrollHeight - oldBox.scrollTop - oldBox.clientHeight) < 120;
  }

  const rows = await sb(
    'conversations?phone_number=eq.' + phone + '&seller_id=eq.' + SELLER_CHAT_ID +
    '&select=role,message,timestamp&order=timestamp.asc&limit=200'
  );
  let isTypingNow = false;
  try {
    const statusRows = await sb(
      'client_status?phone_number=eq.' + phone + '&seller_id=eq.' + SELLER_CHAT_ID + '&select=ai_typing_until'
    );
    if (statusRows && statusRows[0] && statusRows[0].ai_typing_until) {
      isTypingNow = new Date(statusRows[0].ai_typing_until) > new Date();
    }
  } catch (e) {}
  const convo = conversations.find(c => c.phone_number === phone);
  const isActive = convo ? convo.aiActive : true;
  const displayName = convo ? convo.displayName : phone;
  const hasCustomName = displayName !== phone;

  // Build message list with date dividers
  let lastDate = null;
  let bubblesHtml = '';
  rows.forEach(m => {
    const dateStr = new Date(m.timestamp).toDateString();
    if (dateStr !== lastDate) {
      bubblesHtml += `<div class="date-divider">${formatDateDivider(m.timestamp)}</div>`;
      lastDate = dateStr;
    }
    bubblesHtml += renderBubble(m);
  });
  if (isTypingNow) {
    bubblesHtml += `<div class="msg-row in"><div class="bubble typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
  }

  const main = document.getElementById('main');
  const existingTextarea = document.getElementById('reply-text');
  // Same thread mid-refresh: keep whatever's being typed right now.
  // Fresh navigation into this thread: restore its own saved draft, not
  // whatever happens to be sitting in the DOM from a different conversation.
  const draftText = (silent && existingTextarea) ? existingTextarea.value : (drafts[phone] || '');
  const wasFocused = silent && existingTextarea === document.activeElement;
  const cursorPos = (silent && existingTextarea) ? existingTextarea.selectionStart : null;
  const chMeta = CHANNEL_META[convo ? convo.channel : 'whatsapp'] || CHANNEL_META.whatsapp;
  main.innerHTML = `
    <div id="chat-header" style="border-bottom:2px solid ${chMeta.color}">
      <div id="chat-header-info">
        <button id="menu-toggle" onclick="toggleSidebar()" title="Show list"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <button id="back-arrow" onclick="toggleSidebar()" title="Back to chats"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
        <div style="display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;flex:1;" onclick="openProfile('${phone}')">
          <div class="chat-avatar" style="background:${avatarColor(phone)}">${initials(phone)}</div>
          <div style="min-width:0;">
            <h2>${escapeHtml(displayName)}</h2>
            <span class="chat-channel-tag"><span class="dot" style="background:${chMeta.color}"></span>${chMeta.label}${hasCustomName ? ' · ' + phone : ''} · ${rows.length} messages</span>
          </div>
        </div>
      </div>
      </div>
    </div>
    <div id="messages">${bubblesHtml}</div>
    <button id="scroll-bottom-btn" onclick="scrollMessagesToBottom()" title="${t('jump_to_latest')}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></button>
    ${!isActive ? `<div id="ai-paused-banner"><span>${t('ai_paused')}</span><button onclick="resumeAI('${phone}')">${t('turn_ai_on')}</button></div>` : ''}
    <div id="composer">
      <textarea id="reply-text" placeholder="${t('reply_placeholder')}" rows="1"></textarea>
      <button id="mic-btn" onclick="toggleRecording('${phone}')" title="Record voice note"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
    </div>
  `;
  if (!silent) playScreenTransition();
  const box = document.getElementById('messages');
  if (!silent || wasNearBottom) {
    box.scrollTop = box.scrollHeight;
  } else {
    box.scrollTop = Math.min(oldScrollTop, box.scrollHeight);
  }
  updateScrollBtn();
  box.addEventListener('scroll', updateScrollBtn);

  const newTextarea = document.getElementById('reply-text');
  if (newTextarea && draftText) newTextarea.value = draftText;
  if (newTextarea && wasFocused) {
    newTextarea.focus();
    if (cursorPos !== null) newTextarea.setSelectionRange(cursorPos, cursorPos);
  }
}

function renderBubble(m) {
  const isOut = m.role === 'assistant';
  const isNote = (m.message || '').startsWith('📩 Customer:');
  const time = new Date(m.timestamp).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

  </div>`;
}

let mediaRecorder = null;
let recordedChunks = [];
let recordingTimer = null;
let recordingSeconds = 0;

window.toggleRecording = async function(phone) {
  const micBtn = document.getElementById('mic-btn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    // Stop and send
    window._recordingCancelled = false;
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];

    const candidates = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mpeg'];
    let lastError = null;
    for (const candidate of candidates) {
      try {
        if (!MediaRecorder.isTypeSupported(candidate)) continue;
        mediaRecorder = new MediaRecorder(stream, { mimeType: candidate });
        window._recordedMimeType = candidate;
        break;
      } catch (eTry) {
        lastError = eTry;
        mediaRecorder = null;
      }
    }
    if (!mediaRecorder) {
      // Last resort: let the browser pick its own default entirely
      mediaRecorder = new MediaRecorder(stream);
      window._recordedMimeType = mediaRecorder.mimeType || 'audio/webm';
    }

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordingTimer);
      const bar = document.getElementById('recording-bar');
      if (bar) bar.remove();
      const textarea = document.getElementById('reply-text');
      if (textarea) textarea.style.display = '';
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';

      if (window._recordingCancelled) { window._recordingCancelled = false; return; }
      const blob = new Blob(recordedChunks, { type: window._recordedMimeType || 'audio/webm' });
      if (blob.size < 500) return; // too short / accidental tap

      const reader = new FileReader();
      reader.onloadend = async () => {
        await sendVoiceNote(phone, reader.result);
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    micBtn.classList.add('recording');
    micBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    recordingSeconds = 0;

    const textarea = document.getElementById('reply-text');
    if (textarea) textarea.style.display = 'none';
    const composer = document.getElementById('composer');
    const bar = document.createElement('div');
    bar.id = 'recording-bar';
    const waveBars = Array.from({ length: 24 }, (_, i) => `<span style="animation-delay:${(i % 6) * 0.12}s"></span>`).join('');
    bar.innerHTML = `<span class="rec-dot"></span><span id="rec-timer">0:00</span><span class="rec-waveform">${waveBars}</span><button id="rec-cancel" title="Cancel"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>`;
    composer.insertBefore(bar, micBtn);
    document.getElementById('rec-cancel').onclick = () => {
      window._recordingCancelled = true;
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    };
    const timerSpan = document.getElementById('rec-timer');
    recordingTimer = setInterval(() => {
      recordingSeconds++;
      const m = Math.floor(recordingSeconds / 60);
      const s = String(recordingSeconds % 60).padStart(2, '0');
      if (timerSpan) timerSpan.textContent = m + ':' + s;
    }, 1000);
  } catch (e) {
    alert('Could not access microphone: ' + e.message);
  }
};

async function sendVoiceNote(phone, dataUrl) {
  const micBtn = document.getElementById('mic-btn');
  micBtn.disabled = true;
  try {
    const res = await fetch(MANUAL_SEND_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, audioBase64: dataUrl, audioMimeType: window._recordedMimeType || 'audio/webm', sellerChatId: SELLER_CHAT_ID })
    });
    const rawData = await res.json();
    const data = Array.isArray(rawData) ? rawData[0] : rawData;
    if (data && data.success) {
      await loadConversations();
      await loadThread(phone);
    } else {
      alert('Failed to send voice note: ' + (data && data.reason ? data.reason : 'unknown error'));
    }
  } catch (e) {
    alert('Failed to send voice note: ' + e.message);
  }
  const freshMicBtn = document.getElementById('mic-btn');
  if (freshMicBtn) freshMicBtn.disabled = false;
}

};

};

async function renderDevicesList() {
  const myToken = localStorage.getItem('sparkly_session_token');
  const list = document.getElementById('devices-list');
  list.innerHTML = '<div id="loading"><div class="spinner"></div></div>';
  const rows = await sb('sessions?seller_id=eq.' + SELLER_CHAT_ID + '&select=id,session_token,device_label,last_seen_at&order=last_seen_at.desc').catch(() => []);
  if (!rows || rows.length === 0) {
    list.innerHTML = '<div id="loading">No devices found.</div>';
    return;
  }
  list.innerHTML = rows.map(r => {
    const isThis = r.session_token === myToken;
    return `
    <div class="device-row">
      <div class="device-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/></svg></div>
      <div class="device-info">
        <div class="device-label">${escapeHtml(r.device_label || 'Unknown device')}${isThis ? ' <span class="device-this-tag">This device</span>' : ''}</div>
        <div class="device-time">Last active ${timeAgo(r.last_seen_at)}</div>
      </div>
      ${!isThis ? `<button class="device-signout-btn" onclick="signOutDevice('${r.id}')">Sign out</button>` : ''}
    </div>`;
  }).join('');
}

window.signOutDevice = async function(sessionId) {
  const ok = confirm('Sign out this device? It will be logged out the next time it checks in.');
  if (!ok) return;
  try {
    await fetch(SUPABASE_URL + '/rest/v1/sessions?id=eq.' + sessionId, {
      method: 'DELETE',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
    });
  } catch (e) {}
  await renderDevicesList();
};

  list.innerHTML = filtered.map(l => `
    <div class="lang-row ${l.code === currentLang ? 'selected' : ''}" onclick="selectLanguage('${l.code}')">
      <span>${l.name} <span class="lang-native">${l.native}</span></span>

};

function detectDeviceLabel() {
  const ua = navigator.userAgent;
  let os = 'Unknown';
  if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/Windows/.test(ua)) os = 'Windows';
  else if (/Macintosh/.test(ua)) os = 'Mac';
  else if (/Linux/.test(ua)) os = 'Linux';
  let browser = 'Browser';
  if (/Edg/.test(ua)) browser = 'Edge';
  else if (/Chrome/.test(ua)) browser = 'Chrome';
  else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
  else if (/Firefox/.test(ua)) browser = 'Firefox';
  return browser + ' on ' + os;
}

async function ensureSession() {
  let token = localStorage.getItem('sparkly_session_token');
  if (!token) {
    token = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sess-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem('sparkly_session_token', token);
  }
  try {
    await fetch(SUPABASE_URL + '/rest/v1/sessions?on_conflict=session_token', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ session_token: token, seller_id: SELLER_CHAT_ID, device_label: detectDeviceLabel(), last_seen_at: new Date().toISOString() })
    });
  } catch (e) {}
}

let sessionCheckCounter = 0;
async function heartbeatSession() {
  const token = localStorage.getItem('sparkly_session_token');
  if (!token) return;
  sessionCheckCounter++;
  if (sessionCheckCounter % 6 !== 0) return; // roughly every ~48s, not every poll
  try {
    const rows = await sb('sessions?session_token=eq.' + encodeURIComponent(token) + '&select=id');
    if (!rows || rows.length === 0) {
      localStorage.removeItem('sparkly_seller_chat_id');
      localStorage.removeItem('sparkly_session_token');
      alert('You were signed out from this device.');
      location.reload();
      return;
    }
    await fetch(SUPABASE_URL + '/rest/v1/sessions?session_token=eq.' + encodeURIComponent(token), {
      method: 'PATCH',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ last_seen_at: new Date().toISOString() })
    });
  } catch (e) {}
}

function startApp() {
  document.getElementById('app').style.display = 'flex';
  applyLanguageDirection();
  applyTranslations();
  ensureSession();
  loadAiName();
  loadConversations();

// ═══ Edge-swipe-to-go-back, matching WhatsApp/iOS: grab the left edge of an
// open chat and drag right to exit, with the chat list peeking in live. ═══
(function() {
  const EDGE_ZONE = 28;       // px from the left edge that can start the gesture
  const COMPLETE_RATIO = 0.3; // drag past 30% of screen width = commit to closing
  let startX = 0, startY = 0, dragging = false, decided = false, tracking = false;

  const main = document.getElementById('main');
  if (!main) return;

  main.addEventListener('touchstart', (e) => {
    if (window.innerWidth > 720) return;
    const app = document.getElementById('app');
    if (!app.classList.contains('sidebar-hidden')) return; // no open chat to swipe away from
    const touch = e.touches[0];
    if (touch.clientX > EDGE_ZONE) return; // only the edge starts the gesture
    startX = touch.clientX;
    startY = touch.clientY;
    tracking = true;
    dragging = false;
    decided = false;
  }, { passive: true });

  main.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const touch = e.touches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;

    if (!decided) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      decided = true;
      dragging = Math.abs(dx) > Math.abs(dy) && dx > 0;
      if (!dragging) { tracking = false; return; }
      const sidebar = document.getElementById('sidebar');
      main.style.transition = 'none';
      sidebar.style.transition = 'none';
    }
    if (!dragging) return;

    const clamped = Math.max(0, Math.min(dx, window.innerWidth));
    const sidebar = document.getElementById('sidebar');
    main.style.transform = 'translateX(' + clamped + 'px)';
    sidebar.style.marginLeft = (-100 + (clamped / window.innerWidth) * 100) + 'vw';
  }, { passive: true });

  main.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    if (!dragging) return;
    dragging = false;

    const sidebar = document.getElementById('sidebar');
    const dx = (e.changedTouches[0].clientX - startX);
    const ratio = Math.max(0, dx) / window.innerWidth;

    main.style.transition = 'transform 0.2s ease';
    sidebar.style.transition = 'margin-left 0.2s ease';

    if (ratio > COMPLETE_RATIO) {
      main.style.transform = 'translateX(100%)';
      sidebar.style.marginLeft = '0';
      setTimeout(() => {
        document.getElementById('app').classList.remove('sidebar-hidden');
        main.style.transition = '';
        main.style.transform = '';
        sidebar.style.transition = '';
        sidebar.style.marginLeft = '';
      }, 200);
    } else {
      main.style.transform = 'translateX(0)';
      sidebar.style.marginLeft = '-100vw';
      setTimeout(() => {
        main.style.transition = '';
        main.style.transform = '';
        sidebar.style.transition = '';
        sidebar.style.marginLeft = '';
      }, 200);
    }
  });
})();
