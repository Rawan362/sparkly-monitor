<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkly AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4ED;
    --panel: #FFFFFF;
    --panel-2: #EFEAE0;
    --border: #E1DACB;
    --text: #2A2A26;
    --text-muted: #7A7568;
    --accent: #2E4A87;
    --accent-soft: rgba(46,74,135,0.08);
    --on-accent: #FFFFFF;
    --accent-2: #2F9E6E;
    --accent-2-soft: rgba(47,158,110,0.08);
    --danger: #D2483F;
    --danger-soft: rgba(210,72,63,0.08);
    --font-display: 'Fraunces', Georgia, serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #3A4150; }
  #app { display: flex; height: 100vh; position: relative; background: var(--bg); }

  /* ═══ CHANNEL RAIL ═══ */
  #menu-toggle {
    display: none;
    border: none;
    background: none;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    padding: 4px 2px;
    line-height: 1;
  }
  #app.sidebar-hidden #menu-toggle { display: block; }

  /* ═══ SIDEBAR ═══ */
  #sidebar {
    width: 340px;
    min-width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--panel-2);
    transition: margin-left 0.2s ease;
  }
  #app.sidebar-hidden #sidebar { margin-left: -340px; }

  #sidebar-header {
    padding: 22px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #sidebar-header h1 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 2px;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  #sidebar-header p { font-size: 12px; color: var(--text-muted); margin: 0; }
  #sidebar-close {
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
  }
  #sidebar-close:hover { background: var(--panel-2); }

  #channel-pills {
    display: flex;
    gap: 6px;
    padding: 0 14px 12px;
    overflow-x: auto;
  }
  .channel-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--panel-2);
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    border: 1px solid transparent;
  }
  .channel-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .channel-pill.active { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
  .channel-pill.disabled { cursor: not-allowed; opacity: 0.5; }
  .convo-avatar-wrap { position: relative; flex-shrink: 0; }
  .channel-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--panel);
  }
  .chat-channel-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .chat-channel-tag .dot { width: 6px; height: 6px; border-radius: 50%; }

  #search-wrap { padding: 4px 16px 12px; position: relative; }
  #search-box {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 9px 14px 9px 34px;
    font-size: 13.5px;
    color: var(--text);
  }
  #search-box:focus { outline: none; background: var(--panel); border-color: var(--border); }
  #search-icon { position: absolute; left: 30px; top: 14px; color: var(--text-muted); font-size: 13px; pointer-events: none; }

  #convo-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .convo-item {
    padding: 11px 10px;
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: center;
    border-radius: 12px;
    margin-bottom: 2px;
  }
  .convo-item:hover { background: var(--panel-2); }
  .convo-item.active { background: var(--accent-soft); }
  .convo-avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 15px;
  }
  .convo-body { flex: 1; min-width: 0; }
  .convo-top { display: flex; justify-content: space-between; align-items: baseline; }
  .convo-phone { font-weight: 560; font-size: 14px; color: var(--text); }
  .convo-time { font-size: 10.5px; color: var(--text-muted); flex-shrink: 0; }
  .convo-preview-row { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .convo-preview {
    font-size: 12.5px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 210px;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.live { background: var(--accent-2); animation: breathe-live 2.6s ease-in-out infinite; }
  .status-dot.paused { background: var(--danger); }
  @keyframes breathe-live {
    0%, 100% { box-shadow: 0 0 0 0 rgba(47,158,110,0.5); }
    50% { box-shadow: 0 0 0 4px rgba(47,158,110,0); }
  }
  .unread-badge { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .convo-item.unread .convo-phone { font-weight: 650; }
  .convo-item.unread .convo-preview { color: var(--text); font-weight: 560; }

  /* ═══ MAIN CHAT AREA ═══ */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--bg); }
  #empty-state-header { padding: 4px 0 0 16px; height: 0; overflow: visible; }
  #app.sidebar-hidden #empty-state-header { height: auto; padding-top: 16px; padding-bottom: 6px; }
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13.5px;
    gap: 12px;
  }
  #empty-state .icon { font-size: 40px; opacity: 0.25; }

  #chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
  }
  #chat-header-info { display: flex; align-items: center; gap: 12px; }
  #back-arrow {
    display: none;
    border: none;
    background: none;
    font-size: 19px;
    color: var(--text);
    cursor: pointer;
    padding: 4px 2px;
    line-height: 1;
  }
  .chat-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13.5px;
  }
  #chat-header-info h2 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.005em; }
  #chat-header-info span { font-size: 11.5px; color: var(--text-muted); }

  #ai-toggle-wrap { display: flex; align-items: center; gap: 8px; }
  #ai-toggle-label { font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  #ai-toggle {
    position: relative;
    width: 38px;
    height: 21px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    padding: 0;
    background: #ded9d0;
    transition: background 0.15s ease;
  }
  #ai-toggle.on { background: var(--accent-2); }
  #ai-toggle.off { background: var(--danger); }
  #ai-toggle .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: left 0.15s ease;
  }
  #ai-toggle.on .knob { left: 19px; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 8% 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--panel-2);
  }
  #scroll-bottom-btn {
    position: absolute;
    right: 24px;
    bottom: 78px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    z-index: 5;
    transition: background 0.15s ease;
  }
  #scroll-bottom-btn:hover { background: var(--panel-2); }
  #scroll-bottom-btn.show { display: flex; }
  .msg-row { display: flex; margin: 3px 0; }
  .msg-row.out { justify-content: flex-end; }
  .bubble {
    max-width: 62%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.48;
    position: relative;
  }
  .msg-row.in .bubble { background: var(--panel); border: none; border-bottom-left-radius: 4px; color: var(--text); }
  .msg-row.out .bubble { background: var(--accent-soft); color: var(--accent); font-weight: 600; border: none; border-bottom-right-radius: 4px; }
  .bubble .msg-text { white-space: pre-wrap; word-break: break-word; }
  .bubble .ts {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    margin-top: 4px;
    opacity: 0.7;
  }
  .msg-row.in .bubble .ts { color: var(--text-muted); }
  .msg-row.out .bubble .ts { color: rgba(46,74,135,0.7); }
  .ts .ticks { display: inline-flex; }
  .ts .ticks svg { display: block; }
  .ts .ticks.read { color: #4FB3F6; }
  .bubble.private-note { background: #fdf3da; color: #7a6416; border: 1px solid #eddca0; }
  .typing-bubble { display: flex; align-items: center; gap: 4px; padding: 12px 16px !important; }
  .typing-bubble .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: typing-bounce 1.2s infinite ease-in-out; }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .bubble.private-note .ts { color: #7a6416; opacity: 0.65; }
  .date-divider {
    align-self: center;
    background: var(--panel-2);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 8px;
    margin: 12px 0;
  }

  #composer {
    padding: 14px 20px 18px;
    background: var(--bg);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    min-height: 42px;
    background: var(--panel);
    color: var(--text);
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    min-width: 40px;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #mic-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    min-width: 40px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mic-btn.recording {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse-rec 1.2s infinite;
  }
  @keyframes pulse-rec {
    0% { box-shadow: 0 0 0 0 rgba(210,72,63,0.45); }
    70% { box-shadow: 0 0 0 8px rgba(210,72,63,0); }
    100% { box-shadow: 0 0 0 0 rgba(210,72,63,0); }
  }
  #rec-timer { font-size: 12px; color: var(--danger); font-weight: 600; align-self: center; min-width: 34px; text-align: center; }
  #recording-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
  }
  #recording-bar .rec-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    animation: pulse-rec 1.2s infinite;
  }
  #recording-bar .rec-waveform {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 22px;
    overflow: hidden;
  }
  #recording-bar .rec-waveform span {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    opacity: 0.55;
    animation: rec-wave 1s infinite ease-in-out;
  }
  @keyframes rec-wave {
    0%, 100% { height: 6px; }
    50% { height: 20px; }
  }
  #rec-cancel {
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    padding: 4px;
    flex-shrink: 0;
  }
  #rec-cancel:hover { color: var(--danger); }
  #loading { padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ═══ CUSTOMER PROFILE PANEL ═══ */
  #profile-overlay {
    position: fixed;
    inset: 0;
    background: rgba(35,34,32,0.25);
    z-index: 30;
    display: none;
  }
  #profile-overlay.open { display: block; }
  #profile-panel {
    position: fixed;
    top: 0;
    right: -380px;
    width: 380px;
    max-width: 90vw;
    height: 100vh;
    background: var(--panel);
    z-index: 31;
    box-shadow: -4px 0 20px rgba(0,0,0,0.08);
    transition: right 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  #profile-overlay.open #profile-panel { right: 0; }
  #profile-header {
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  #profile-close { border: none; background: none; font-size: 17px; cursor: pointer; color: var(--text); }
  #profile-body { padding: 26px 20px; text-align: center; }
  #profile-avatar-lg {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 28px;
    margin: 0 auto 14px;
  }
  #profile-name-display { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  #profile-name { font-size: 17px; font-weight: 620; margin: 0 0 2px; }
  #profile-name-edit-icon { font-size: 12px; color: var(--text-muted); opacity: 0.6; }
  #profile-name-input {
    font-size: 17px;
    font-weight: 620;
    border: none;
    border-bottom: 2px solid var(--accent);
    background: transparent;
    text-align: center;
    padding: 2px 4px;
    width: 200px;
    max-width: 70vw;
    color: var(--text);
  }
  #profile-name-input:focus { outline: none; }
  #profile-name-save {
    border: none;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 7px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 6px;
  }
  #profile-phone { font-size: 12.5px; color: var(--text-muted); margin: 0 0 4px; }
  .profile-badges { display: flex; gap: 6px; justify-content: center; margin: 12px 0 4px; flex-wrap: wrap; }
  .profile-badge {
    font-size: 10.5px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: 20px;
  }
  .profile-badge.vip { background: #fdf3da; color: #7a6416; }
  .profile-badge.wholesale { background: var(--accent-2-soft); color: var(--accent-2); }
  .profile-section { text-align: left; padding: 18px 22px; border-top: 1px solid var(--border); }
  .profile-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 0 0 12px; font-weight: 650; }
  .profile-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13px; }
  .profile-row .label { color: var(--text-muted); }
  .profile-row .value { font-weight: 600; text-align: right; color: var(--text); }
  .profile-notes { font-size: 13px; color: var(--text); line-height: 1.55; background: var(--panel-2); padding: 12px 14px; border-radius: 10px; }
  #profile-loading { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ═══ LANDING PAGE ═══ */
  #landing {
    position: fixed;
    inset: 0;
    background: var(--bg);
    overflow-y: auto;
    z-index: 40;
  }
  .land-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 6%;
    max-width: 1180px;
    margin: 0 auto;
  }
  .land-brand { display: flex; align-items: center; gap: 10px; }
  .land-brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .land-brand span { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.005em; }
  .land-nav-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .land-nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  .land-hero {
    max-width: 780px;
    margin: 0 auto;
    padding: 90px 6% 70px;
    text-align: center;
  }
  .land-eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 650;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 13px;
    border-radius: 20px;
    margin-bottom: 22px;
    letter-spacing: 0.01em;
  }
  .land-hero h1 {
    font-family: var(--font-display);
    font-size: 48px;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--text);
    margin: 0 0 20px;
  }
  .land-hero h1 em { color: var(--accent); font-style: italic; }
  .land-hero p {
    font-size: 17px;
    line-height: 1.55;
    color: var(--text-muted);
    margin: 0 auto 34px;
    max-width: 560px;
  }
  .land-cta {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    padding: 14px 30px;
    border-radius: 11px;
    font-size: 15px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 8px 20px -8px rgba(46,74,135,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .land-cta:hover { transform: translateY(-1px); box-shadow: 0 12px 24px -8px rgba(46,74,135,0.45); }

  .land-preview {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 6% 90px;
  }
  .land-preview-frame {
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px -20px rgba(46,74,135,0.18);
    background: var(--panel);
  }
  .land-preview-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .land-preview-bar span { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .land-preview-body { padding: 30px; display: flex; gap: 16px; }
  .land-preview-col-a { width: 34%; display: flex; flex-direction: column; gap: 10px; }
  .land-preview-col-b { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .land-skel { background: var(--panel-2); border-radius: 8px; }
  .land-bubble { padding: 10px 14px; border-radius: 14px; font-size: 12px; max-width: 70%; }
  .land-bubble.in { background: var(--panel-2); align-self: flex-start; }
  .land-bubble.out { background: var(--accent-soft); color: var(--accent); align-self: flex-end; font-weight: 600; }

  .land-features {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 6% 90px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  .land-feature { padding: 26px 22px; }
  .land-feature-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .land-feature h3 { font-size: 15px; font-weight: 650; margin: 0 0 8px; color: var(--text); }
  .land-feature p { font-size: 13px; line-height: 1.55; color: var(--text-muted); margin: 0; }

  .land-footer {
    border-top: 1px solid var(--border);
    padding: 26px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1180px;
    margin: 0 auto;
  }
  .land-footer span { font-size: 12px; color: var(--text-muted); }

  @media (max-width: 860px) {
    .land-features { grid-template-columns: 1fr 1fr; }
    .land-hero h1 { font-size: 32px; }
    .land-preview-body { flex-direction: column; }
    .land-preview-col-a { width: 100%; }
  }

  /* ═══ LOGIN SCREEN ═══ */
  #login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #login-card {
    width: 340px;
    max-width: 88vw;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 30px 30px;
    box-shadow: 0 24px 60px -20px rgba(42,42,38,0.16);
  }
  #login-logo {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 6px;
  }
  #login-card h1 { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.005em; color: var(--text); }
  .login-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 6px; }
  #login-error {
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 2px;
  }
  #login-card input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    background: var(--panel-2);
    color: var(--text);
  }
  #login-card input:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  #login-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  #login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  #settings-btn {
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
  }
  #settings-btn:hover { background: var(--panel-2); color: var(--text); }

  #ahmad-pinned {
    margin: 0 14px 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  #ahmad-pinned-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #ahmad-pinned-title { font-size: 13px; font-weight: 600; color: var(--text); }
  #ahmad-pinned-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  #ahmad-pinned.active { border-width: 2px; }

  #settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,18,14,0.35);
    z-index: 40;
    align-items: center;
    justify-content: center;
  }
  #settings-overlay.show { display: flex; }
  #settings-panel {
    width: 340px;
    max-width: 90vw;
    background: var(--panel);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px -20px rgba(42,42,38,0.3);
    overflow: hidden;
  }
  #settings-panel-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #settings-panel-header h3 { margin: 0; font-size: 15px; font-weight: 600; }
  #settings-panel-close { border: none; background: none; cursor: pointer; color: var(--text-muted); display: flex; }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text);
  }
  .settings-row:hover { background: var(--panel-2); }
  .settings-row.danger { color: var(--danger); }
  .settings-row svg { flex-shrink: 0; opacity: 0.75; }

  @media (max-width: 720px) {
    #sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 100vw; min-width: 0; z-index: 15; }
    #app.sidebar-hidden #sidebar { margin-left: -100vw; }
    #main { width: 100%; }
    #back-arrow { display: block; }
    .convo-preview { max-width: 55vw; }
    #profile-panel { width: 100vw; max-width: 100vw; right: -100vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <div>
        <h1>Sparkly AI</h1>
        <p id="seller-label">Loading...</p>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        <button id="settings-btn" onclick="openSettings()" title="Settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button id="sidebar-close" onclick="toggleSidebar()" title="Hide list"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

    <div id="ahmad-pinned" onclick="openAhmadChat()">
      <div id="ahmad-pinned-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 14.2 9.3 21.5 12 14.2 14.7 12 22 9.8 14.7 2.5 12 9.8 9.3 12 2Z"/></svg></div>
      <div>
        <div id="ahmad-pinned-title">Talk to Ahmad</div>
        <div id="ahmad-pinned-sub">Set up products, rules & business info</div>

    </div>
    <div id="channel-pills"></div>
    <div id="search-wrap">
      <span id="search-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input id="search-box" placeholder="Search conversations" oninput="filterConvos(this.value)">
    </div>
    <div id="convo-list"><div id="loading">Loading conversations...</div></div>
  </div>
  <div id="main">
    <div id="empty-state-header"><button id="menu-toggle" onclick="toggleSidebar()" title="Show list"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button></div>
    <div id="empty-state">
      <div class="icon"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div>Select a conversation to view it</div>
    </div>
  </div>
</div>

<div id="profile-overlay" onclick="if(event.target===this) closeProfile()">
  <div id="profile-panel">
    <div id="profile-header">
      <button id="profile-close" onclick="closeProfile()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      <span style="font-weight:600;font-size:15px;">Contact info</span>
    </div>
    <div id="profile-content"><div id="profile-loading">Loading...</div></div>

<div id="settings-overlay" onclick="if(event.target===this) closeSettings()">

      <h3>Settings</h3>
      <button id="settings-panel-close" onclick="closeSettings()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 14.2 9.3 21.5 12 14.2 14.7 12 22 9.8 14.7 2.5 12 9.8 9.3 12 2Z"/></svg>
      Talk to Ahmad
    </div>

      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — for the SaaS version, sellerChatId will come from a real login
// system instead of being hardcoded here. The CHANNEL_ICONS/rail structure
// is built so new platforms (Instagram, Messenger) can be added later just
// by tagging conversations with a different `channel` value — no rebuild
// of the core UI needed.
// ═══════════════════════════════════════════════
const SUPABASE_URL = 'https://qfmmoobwzuhiimmjixes.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmbW1vb2J3enVoaWltbWppeGVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTMzNDcsImV4cCI6MjA5NDI2OTM0N30.ZC81X_-Fe3tjPDhL7s6oemlTJDuIWRnguDIq3ZklxeA';
const MANUAL_SEND_WEBHOOK = 'https://sparklly.site/webhook/monitor-manual-send';
const AHMAD_CHAT_WEBHOOK = 'https://sparklly.site/webhook/business-chat'; // wired up in the next step
let ahmadChatOpen = false;
let SELLER_CHAT_ID = null; // set after login
const CHANNEL_META = {
  whatsapp:  { label: 'WhatsApp',  color: '#25D366' },
  instagram: { label: 'Instagram', color: '#C13584' },
  messenger: { label: 'Messenger', color: '#0084FF' },
  tiktok:    { label: 'TikTok',    color: '#000000' },
  email:     { label: 'Email',     color: '#7A7568' }
};
const LIVE_CHANNELS = ['whatsapp']; // channels with real data flowing today
let channelFilter = 'all';

let conversations = [];
let activePhone = null;
let searchQuery = '';
let drafts = {}; // per-conversation unsent text — key is phone number, or 'ahmad'
function saveCurrentDraft() {
  const ta = document.getElementById('reply-text');
  if (!ta) return;
  const key = ahmadChatOpen ? 'ahmad' : activePhone;
  if (key) drafts[key] = ta.value;
}
let pollTimer = null;

async function sb(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
  });
  if (!res.ok) throw new Error('Supabase error ' + res.status);
  return res.json();
}

function timeAgo(ts) {
  const diff = (Date.now() - new Date(ts).getTime()) / 1000;
  if (diff < 60) return 'now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'd';
}

function initials(phone) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  return digits.slice(-2) || '?';
}

// Slack/WhatsApp-style avatar palette — muted, pleasant tones that read
// well with white text. Same phone number always maps to the same color.
const AVATAR_PALETTE = [
  '#6b7fd7', '#e08e45', '#4fa88c', '#c76b96', '#5aa9c9',
  '#a67c52', '#7d8c5c', '#c96b6b', '#8577c9', '#4f9a6f'
];
function avatarColor(phone) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  let hash = 0;
  for (let i = 0; i < digits.length; i++) {
    hash = (hash * 31 + digits.charCodeAt(i)) % 100000;
  }
  return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
}

async function loadConversations() {
  const rows = await sb(
    'conversations?seller_id=eq.' + SELLER_CHAT_ID +
    '&select=phone_number,message,role,timestamp,channel&order=timestamp.desc&limit=500'
  );
  const byPhone = {};
  rows.forEach(r => {
    if (!byPhone[r.phone_number]) byPhone[r.phone_number] = r;
  });
  const statuses = await sb(
    'client_status?seller_id=eq.' + SELLER_CHAT_ID + '&select=phone_number,ai_active'
  );
  const statusMap = {};
  statuses.forEach(s => { statusMap[s.phone_number] = s.ai_active !== false; });

  const custs = await sb(
    'customers?seller_id=eq.' + SELLER_CHAT_ID + '&select=phone,name'
  );
  const nameMap = {};
  custs.forEach(c => { if (c.name) nameMap[c.phone] = c.name; });

  conversations = Object.values(byPhone)
    .map(c => ({ ...c, channel: c.channel || 'whatsapp', aiActive: statusMap[c.phone_number] !== false, displayName: nameMap[c.phone_number] || c.phone_number }))
    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  renderChannelPills();
  renderConvoList();
  if (activePhone) await loadThread(activePhone, true);
  if (ahmadChatOpen) await renderAhmadChatPanel(true);
}

function renderChannelPills() {
  const el = document.getElementById('channel-pills');
  if (!el) return;
  const order = ['all', 'whatsapp', 'instagram', 'messenger', 'tiktok', 'email'];
  el.innerHTML = order.map(key => {
    if (key === 'all') {
      return `<div class="channel-pill ${channelFilter === 'all' ? 'active' : ''}" onclick="setChannelFilter('all')">All</div>`;
    }
    const meta = CHANNEL_META[key];
    const isLive = LIVE_CHANNELS.includes(key);
    const cls = 'channel-pill' + (channelFilter === key ? ' active' : '') + (isLive ? '' : ' disabled');
    const title = isLive ? meta.label : meta.label + ' — coming soon';
    const onclick = isLive ? `onclick="setChannelFilter('${key}')"` : '';
    return `<div class="${cls}" title="${title}" ${onclick}><span class="dot" style="background:${meta.color}"></span>${meta.label}</div>`;
  }).join('');
}

window.setChannelFilter = function(key) {
  channelFilter = key;
  renderChannelPills();
  renderConvoList();
};

function renderConvoList() {
  const el = document.getElementById('convo-list');
  document.getElementById('seller-label').textContent = conversations.length + ' conversations';
  let filtered = searchQuery
    ? conversations.filter(c => c.phone_number.includes(searchQuery) || (c.message || '').toLowerCase().includes(searchQuery.toLowerCase()))
    : conversations;
  if (channelFilter !== 'all') filtered = filtered.filter(c => c.channel === channelFilter);
  if (filtered.length === 0) {
    el.innerHTML = '<div id="loading">' + (searchQuery || channelFilter !== 'all' ? 'No matches.' : 'No conversations yet.') + '</div>';
    return;
  }
  el.innerHTML = filtered.map(c => {
    const isUnread = c.role === 'user';
    const chMeta = CHANNEL_META[c.channel] || CHANNEL_META.whatsapp;
    return `
    <div class="convo-item ${c.phone_number === activePhone ? 'active' : ''} ${isUnread ? 'unread' : ''}" onclick="selectConvo('${c.phone_number}')">
      <div class="convo-avatar-wrap">
        <div class="convo-avatar" style="background:${avatarColor(c.phone_number)}">${initials(c.phone_number)}</div>
        <span class="channel-badge" style="background:${chMeta.color}" title="${chMeta.label}"></span>
      </div>
      <div class="convo-body">
        <div class="convo-top">
          <span class="convo-phone">${escapeHtml(c.displayName)}</span>
          <span class="convo-time">${timeAgo(c.timestamp)}</span>
        </div>
        <div class="convo-preview-row">
          <span class="convo-preview">${c.role === 'user' ? '' : '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:2px;opacity:0.6;"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>'}${escapeHtml(c.message).slice(0, 46)}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            ${isUnread ? '<span class="unread-badge"></span>' : ''}
            <span class="status-dot ${c.aiActive ? 'live' : 'paused'}"></span>
          </span>
        </div>
      </div>
    </div>
  `;
  }).join('');
}

window.filterConvos = function(val) {
  searchQuery = val;
  renderConvoList();
};

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

window.openProfile = async function(phone) {
  const overlay = document.getElementById('profile-overlay');
  const content = document.getElementById('profile-content');
  content.innerHTML = '<div id="profile-loading">Loading...</div>';
  overlay.classList.add('open');

  try {
    const rows = await sb(
      'customers?phone=eq.' + encodeURIComponent(phone) + '&seller_id=eq.' + SELLER_CHAT_ID + '&select=*&limit=1'
    );
    const cust = rows && rows[0] ? rows[0] : null;
    const color = avatarColor(phone);
    const name = (cust && cust.name) || phone;

    let badgesHtml = '';
    if (cust && cust.is_vip) badgesHtml += '<span class="profile-badge vip"><svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor" style="vertical-align:-1px;margin-right:3px;"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>VIP</span>';
    if (cust && cust.is_wholesale) badgesHtml += '<span class="profile-badge wholesale">Wholesale</span>';

    const fmt = (v) => v ? v : '—';
    const fmtDate = (v) => v ? new Date(v).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
    const fmtMoney = (v) => (v || v === 0) ? '$' + Number(v).toLocaleString() : '—';

    content.innerHTML = `
      <div id="profile-body">
        <div id="profile-avatar-lg" style="background:${color}">${initials(phone)}</div>
        <div id="profile-name-display" onclick="startEditName('${phone}')">
          <h2 id="profile-name">${escapeHtml(name)}</h2>
          <span id="profile-name-edit-icon"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span>
        </div>
        <p id="profile-phone">${phone}</p>
        <div class="profile-badges">${badgesHtml}</div>
      </div>
      <div class="profile-section">

function formatDateDivider(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
}

async function loadThread(phone, silent) {
  const oldBox = document.getElementById('messages');
  let oldScrollTop = 0;
  let wasNearBottom = true;
  if (oldBox) {
    oldScrollTop = oldBox.scrollTop;
    wasNearBottom = (oldBox.scrollHeight - oldBox.scrollTop - oldBox.clientHeight) < 120;
  }

  const rows = await sb(
    'conversations?phone_number=eq.' + phone + '&seller_id=eq.' + SELLER_CHAT_ID +
    '&select=role,message,timestamp&order=timestamp.asc&limit=200'

    const statusRows = await sb(
      'client_status?phone_number=eq.' + phone + '&seller_id=eq.' + SELLER_CHAT_ID + '&select=ai_typing_until'
    );
    if (statusRows && statusRows[0] && statusRows[0].ai_typing_until) {
      isTypingNow = new Date(statusRows[0].ai_typing_until) > new Date();
    }
  } catch (e) {}
  const convo = conversations.find(c => c.phone_number === phone);
  const isActive = convo ? convo.aiActive : true;
  const displayName = convo ? convo.displayName : phone;
  const hasCustomName = displayName !== phone;

      bubblesHtml += `<div class="date-divider">${formatDateDivider(m.timestamp)}</div>`;

    bubblesHtml += renderBubble(m);

    bubblesHtml += `<div class="msg-row in"><div class="bubble typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
  }

  const main = document.getElementById('main');
  const existingTextarea = document.getElementById('reply-text');

  const draftText = (silent && existingTextarea) ? existingTextarea.value : (drafts[phone] || '');

        <button id="back-arrow" onclick="toggleSidebar()" title="Back to chats"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
        <div style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="openProfile('${phone}')">
          <div class="chat-avatar" style="background:${avatarColor(phone)}">${initials(phone)}</div>
          <div>
            <h2>${escapeHtml(displayName)}</h2>
            <span class="chat-channel-tag"><span class="dot" style="background:${chMeta.color}"></span>${chMeta.label}${hasCustomName ? ' · ' + phone : ''} · ${rows.length} messages</span>
          </div>
        </div>
      </div>
      <div id="ai-toggle-wrap" title="${isActive ? 'AI is handling this conversation' : 'AI is paused — manual mode'}">
        <span id="ai-toggle-label">${isActive ? 'AI on' : 'AI off'}</span>
        <button id="ai-toggle" class="${isActive ? 'on' : 'off'}" onclick="${isActive ? `pauseAI('${phone}')` : `resumeAI('${phone}')`}">
          <span class="knob"></span>
        </button>
      </div>
    </div>
    <div id="messages">${bubblesHtml}</div>
    <button id="scroll-bottom-btn" onclick="scrollMessagesToBottom()" title="Jump to latest"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></button>

  }
  updateScrollBtn();
  box.addEventListener('scroll', updateScrollBtn);

  const newTextarea = document.getElementById('reply-text');
  if (newTextarea && draftText) newTextarea.value = draftText;
  if (newTextarea && wasFocused) {
    newTextarea.focus();
    if (cursorPos !== null) newTextarea.setSelectionRange(cursorPos, cursorPos);
  }
}

let mediaRecorder = null;
let recordedChunks = [];
let recordingTimer = null;
let recordingSeconds = 0;

window.toggleRecording = async function(phone) {
  const micBtn = document.getElementById('mic-btn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    // Stop and send
    window._recordingCancelled = false;
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];

    const candidates = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mpeg'];
    let lastError = null;
    for (const candidate of candidates) {
      try {
        if (!MediaRecorder.isTypeSupported(candidate)) continue;
        mediaRecorder = new MediaRecorder(stream, { mimeType: candidate });
        window._recordedMimeType = candidate;
        break;
      } catch (eTry) {
        lastError = eTry;
        mediaRecorder = null;
      }
    }
    if (!mediaRecorder) {
      // Last resort: let the browser pick its own default entirely
      mediaRecorder = new MediaRecorder(stream);
      window._recordedMimeType = mediaRecorder.mimeType || 'audio/webm';
    }

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordingTimer);
      const bar = document.getElementById('recording-bar');
      if (bar) bar.remove();
      const textarea = document.getElementById('reply-text');
      if (textarea) textarea.style.display = '';
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';

      if (window._recordingCancelled) { window._recordingCancelled = false; return; }
      const blob = new Blob(recordedChunks, { type: window._recordedMimeType || 'audio/webm' });
      if (blob.size < 500) return; // too short / accidental tap

      const reader = new FileReader();
      reader.onloadend = async () => {
        await sendVoiceNote(phone, reader.result);
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    micBtn.classList.add('recording');
    micBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    recordingSeconds = 0;

    const textarea = document.getElementById('reply-text');
    if (textarea) textarea.style.display = 'none';
    const composer = document.getElementById('composer');
    const bar = document.createElement('div');
    bar.id = 'recording-bar';
    const waveBars = Array.from({ length: 24 }, (_, i) => `<span style="animation-delay:${(i % 6) * 0.12}s"></span>`).join('');
    bar.innerHTML = `<span class="rec-dot"></span><span id="rec-timer">0:00</span><span class="rec-waveform">${waveBars}</span><button id="rec-cancel" title="Cancel"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>`;
    composer.insertBefore(bar, micBtn);
    document.getElementById('rec-cancel').onclick = () => {
      window._recordingCancelled = true;
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    };
    const timerSpan = document.getElementById('rec-timer');
    recordingTimer = setInterval(() => {
      recordingSeconds++;
      const m = Math.floor(recordingSeconds / 60);
      const s = String(recordingSeconds % 60).padStart(2, '0');
      if (timerSpan) timerSpan.textContent = m + ':' + s;
    }, 1000);
  } catch (e) {
    alert('Could not access microphone: ' + e.message);
  }
};

async function sendVoiceNote(phone, dataUrl) {
  const micBtn = document.getElementById('mic-btn');
  micBtn.disabled = true;
  try {
    const res = await fetch(MANUAL_SEND_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, audioBase64: dataUrl, audioMimeType: window._recordedMimeType || 'audio/webm', sellerChatId: SELLER_CHAT_ID })
    });
    const rawData = await res.json();
    const data = Array.isArray(rawData) ? rawData[0] : rawData;
    if (data && data.success) {
      await loadConversations();
      await loadThread(phone);
    } else {
      alert('Failed to send voice note: ' + (data && data.reason ? data.reason : 'unknown error'));
    }
  } catch (e) {
    alert('Failed to send voice note: ' + e.message);
  }
  const freshMicBtn = document.getElementById('mic-btn');
  if (freshMicBtn) freshMicBtn.disabled = false;
}

window.sendReply = async function(phone) {
  const textarea = document.getElementById('reply-text');
  const message = textarea.value.trim();
  if (!message) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  try {
    const res = await fetch(MANUAL_SEND_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, message, sellerChatId: SELLER_CHAT_ID })
    });
    const rawData = await res.json();
    const data = Array.isArray(rawData) ? rawData[0] : rawData;
    if (data && data.success) {
      textarea.value = '';
      delete drafts[phone];
      await loadConversations();
      await loadThread(phone);
      const freshTextarea = document.getElementById('reply-text');
      if (freshTextarea) freshTextarea.focus();
    } else {
      alert('Failed to send: ' + (data && data.reason ? data.reason : 'unknown error'));
    }
  } catch (e) {
    alert('Failed to send: ' + e.message);
  }
  const freshBtn = document.getElementById('send-btn');
  if (freshBtn) freshBtn.disabled = false;
};

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'reply-text' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (ahmadChatOpen) sendAhmadMessage();
    else if (activePhone) sendReply(activePhone);
  }
});

}

function showLoginScreen(errorMsg) {
  const landing = document.getElementById('landing');
  if (landing) landing.remove();
  document.getElementById('app').style.display = 'none';
  let overlay = document.getElementById('login-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'login-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `
    <div id="login-card">
      <div id="login-logo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <h1>Sparkly AI</h1>
      <p class="login-sub">Sign in with your seller chat ID</p>
      ${errorMsg ? `<div id="login-error">${escapeHtml(errorMsg)}</div>` : ''}
      <input id="login-chatid" placeholder="Seller chat ID" autocomplete="off">
      <input id="login-password" type="password" placeholder="Password">
      <button id="login-btn" onclick="doLogin()">Sign in</button>
    </div>
  `;
  document.getElementById('login-chatid').focus();
  document.addEventListener('keydown', loginKeyHandler);
}

function loginKeyHandler(e) {
  if (e.key === 'Enter' && document.getElementById('login-overlay')) doLogin();
}

window.doLogin = async function() {
  const chatId = document.getElementById('login-chatid').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  if (!chatId || !password) return;
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  try {
    const rows = await sb('sellers?chat_id=eq.' + encodeURIComponent(chatId) + '&select=chat_id,dashboard_password&limit=1');
    if (!rows || rows.length === 0 || rows[0].dashboard_password !== password) {
      showLoginScreen('Incorrect chat ID or password.');
      return;
    }
    localStorage.setItem('sparkly_seller_chat_id', chatId);
    SELLER_CHAT_ID = chatId;
    document.removeEventListener('keydown', loginKeyHandler);
    const overlay = document.getElementById('login-overlay');
    if (overlay) overlay.remove();
    document.getElementById('app').style.display = 'flex';
    startApp();
  } catch (e) {
    showLoginScreen('Something went wrong — try again.');
  }
};

window.logout = function() {
  localStorage.removeItem('sparkly_seller_chat_id');
  location.reload();
};

window.openSettings = function() {
  document.getElementById('settings-overlay').classList.add('show');
};
window.closeSettings = function() {
  document.getElementById('settings-overlay').classList.remove('show');
};

function startApp() {
  document.getElementById('app').style.display = 'flex';
  loadConversations();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadConversations, 8000);
}

document.addEventListener('DOMContentLoaded', initAuth);
