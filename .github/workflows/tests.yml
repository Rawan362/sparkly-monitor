name: tests
# Runs the web app's own tests (no network, no secrets). The browser tests use Playwright with Chromium, installed here for the run only.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 tests/*.test.mjs
